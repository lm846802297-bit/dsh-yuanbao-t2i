name: CI

# 触发条件：推 master + 所有 PR
on:
  push:
    branches: [master]
  pull_request:

# 只读权限，不碰仓库内容
permissions:
  contents: read

# 同一个分支只保留最新一次 run，旧 run 自动取消
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 只需要一个能跑 py_compile 的解释器；不装 torch、不装模型权重
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if npm ci --ignore-scripts --no-audit --no-fund; then
            echo "npm ci ok"
          else
            echo "::warning::npm ci 失败（package.json / package-lock.json 不同步），退回 npm install（不改 lockfile）"
            npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          fi

      - name: Syntax check (node --check + py_compile)
        run: node scripts/ci/check-syntax.cjs

      - name: Tool registration probe
        run: node scripts/ci/probe-tools.cjs

      - name: Route probe
        run: node scripts/ci/probe-routes.cjs

      # 历史回归锁：6 条曾经真机踩过、而 lint/语法检查抓不到的静默失效
      - name: Regression locks (历史回归锁)
        run: node scripts/ci/check-regressions.cjs

      - name: Package integrity check
        run: node scripts/ci/check-package.cjs
