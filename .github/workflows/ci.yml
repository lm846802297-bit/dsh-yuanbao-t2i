name: CI

# 触发条件：推 master + 所有 PR + 每天定时巡检 + 手动触发
on:
  push:
    branches: [master]
  pull_request:
  # 定时巡检：cron 一律按 UTC 算 ⇒ '0 3 * * 1' = 每周一 03:00 UTC = 北京时间 11:00
  # 目的：外部依赖会漂（actions 大版本升级、npm 上游包变动、runner 镜像换批），
  #      不推代码就不跑 CI ⇒ 真到要发版那天才发现红。
  schedule:
    - cron: '0 3 * * 1'
  # 手动触发：Actions 页右上角「Run workflow」，用来验证定时那条链路是否还通
  # ⚠️ 自测失败通知请走 self-test.yml（单独一个 workflow），⛔ 别在本文件加「故意失败」开关——
  #    自测的红 run 会混进主 CI 历史，以后分不清哪条红是真回归。
  workflow_dispatch:

# 只读权限，不碰仓库内容
permissions:
  contents: read

# 同一个分支只保留最新一次 run，旧 run 自动取消
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # 只需要一个能跑 py_compile 的解释器；不装 torch、不装模型权重
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -e
          if npm ci --ignore-scripts --no-audit --no-fund; then
            echo "npm ci ok"
          else
            echo "::warning::npm ci 失败（package.json / package-lock.json 不同步），退回 npm install（不改 lockfile）"
            npm install --ignore-scripts --no-audit --no-fund --no-package-lock
          fi

      # 掩膜闸门要真跑 PIL/numpy（合成图上验「该降级时降级」）；装这两包 ~10s，不装 torch
      - name: Python deps (numpy + pillow, for mask gate)
        run: python -m pip install --quiet --disable-pip-version-check numpy pillow

      - name: Syntax check (node --check + py_compile)
        run: node scripts/ci/check-syntax.cjs

      # 掩膜检测闸门：真跑 wm_lama 的检测函数（不是静态扫描）——v0.9.0 前的「掩膜近空、
      # 静默不修」只有行为测试能抓住。显式指定解释器，⛔ 别让它因为找不到 numpy 而 SKIP。
      - name: Mask gate (掩膜检测闸门)
        env:
          DSH_LAMA_PYTHON: python
        run: node scripts/ci/probe-mask.cjs

      - name: Tool registration probe
        run: node scripts/ci/probe-tools.cjs

      - name: Route probe
        run: node scripts/ci/probe-routes.cjs

      # 历史回归锁：9 条曾经真机踩过、而 lint/语法检查抓不到的静默失效
      - name: Workflow structure gate (workflow 结构闸)
        run: node scripts/ci/check-workflows.cjs

      - name: Regression locks (历史回归锁)
        run: node scripts/ci/check-regressions.cjs

      - name: Package integrity check
        run: node scripts/ci/check-package.cjs

  # 失败通知：check 挂了就调用可复用 workflow 开 issue（逻辑只写在 notify-issue.yml 一份）
  # ⛔ 不接外部 webhook / 不配 secret：零配置、零密钥，红了必留痕
  notify:
    name: 失败通知
    needs: [check]
    if: failure()
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/notify-issue.yml
    with:
      title: 'CI 失败'
      source: 'ci.yml 的 check（ubuntu/windows × node 22/24）'
